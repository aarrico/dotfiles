# City Lights (https://citylights.xyz/)
# Values taken from the official VSCode theme:
#   Yummygum/city-lights-syntax-vsc → themes/City Lights-color-theme.json
# Edit a value here then run `chezmoi apply` — every terminal, prompt,
# and multiplexer config templates off this single file.
[colors]
# base
bg           = "#1d252c"  # editor.background
bg_dark      = "#171d23"  # sideBar / panel / statusBar background
fg           = "#b7c5d3"  # editor.foreground
cursor       = "#5ec4ff"
selection    = "#28323a"

# 16-color ANSI (used by WezTerm + Ghostty)
black        = "#1d252c"
bright_black = "#41505e"  # comment
red          = "#d95468"  # invalid
green        = "#8bd49c"
yellow       = "#ebbf83"
blue         = "#5ec4ff"  # keyword
magenta      = "#b62d65"
cyan         = "#70e1e8"  # entity
white        = "#b7c5d3"
bright_white = "#d9e5f2"

# semantic aliases (used by starship / tmux / fzf)
pink         = "#e27e8d"  # constant
orange       = "#d98e48"
purple       = "#68a1f0"  # City Lights has no true purple; soft blue stands in
teal         = "#008b94"  # storage
border       = "#41505e"
inactive     = "#718ca1"  # punctuation / variable
